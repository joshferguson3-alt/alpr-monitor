name: Daily ALPR signal run

on:
  schedule:
    # GitHub Actions cron is UTC and does not follow daylight saving time.
    # 10:00 UTC is 6:00 AM Eastern Daylight Time.
    # 11:00 UTC is 6:00 AM Eastern Standard Time.
    # 16:00 and 21:00 UTC are backups when GitHub starts the morning cron late.
    # A scheduled run collects once on or after 6:00 AM Eastern. A later cron
    # the same New York day logs that today's run already started.
    # workflow_dispatch sets ALPR_SCHEDULED to 0, so a manual run always proceeds.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
    - cron: "0 16 * * *"
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run the live Haiku 10-passage classifier test
        type: boolean
        default: false
      lookback_days:
        description: Backfill window in days. Empty keeps the normal 14/90 rule.
        type: string
        default: ""

permissions:
  contents: write

# Schedule and workflow_dispatch share one queue. A second run waits
# instead of pushing the signal database over the first run's commit.
concurrency:
  group: alpr-daily
  cancel-in-progress: false

jobs:
  live-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Live Haiku 10-passage test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/test_classify_live.py -q

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          # A queued run must start from the branch tip, not the SHA that
          # triggered it. Otherwise it rebuilds the signal database from
          # before the run it waited on.
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect and classify
        timeout-minutes: 36
        env:
          # workflow_dispatch leaves this unset-as-zero so the 6 AM Eastern gate does not apply.
          ALPR_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_SIGNALS_DB_ID: ${{ secrets.NOTION_SIGNALS_DB_ID }}
          NOTION_AGENCIES_DB_ID: ${{ secrets.NOTION_AGENCIES_DB_ID }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ALPR_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_days || '' }}
        run: python -m monitor.run --db data/monitor.sqlite --no-publish

      - name: Publish Notion and digest
        if: always() && !cancelled()
        env:
          ALPR_SCHEDULED: "0"
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_SIGNALS_DB_ID: ${{ secrets.NOTION_SIGNALS_DB_ID }}
          NOTION_AGENCIES_DB_ID: ${{ secrets.NOTION_AGENCIES_DB_ID }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ALPR_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_days || '' }}
        run: python -m monitor.run --db data/monitor.sqlite --publish-only

      - name: Commit the updated database
        if: always() && !cancelled()
        run: |
          git config user.name "alpr-monitor"
          git config user.email "actions@github.com"
          git add data/monitor.sqlite
          if git diff --cached --quiet; then
            echo "No database change"
          else
            git commit -m "Daily signal database update"
            branch="${GITHUB_REF_NAME:-main}"
            attempt=1
            while [ "$attempt" -le 3 ]; do
              git rebase --abort >/dev/null 2>&1 || true
              if git pull --rebase origin "$branch"; then
                if git push origin "HEAD:${branch}"; then
                  echo "pushed database on attempt ${attempt}"
                  exit 0
                fi
                echo "push rejected, retry ${attempt}"
              elif [ -d .git/rebase-merge ] || [ -d .git/rebase-apply ]; then
                echo "rebase conflict on attempt ${attempt}, keeping this run's database"
                git checkout --theirs -- data/monitor.sqlite
                git add data/monitor.sqlite
                if git diff --name-only --diff-filter=U | grep -q .; then
                  echo "unresolved conflict outside data/monitor.sqlite"
                  git rebase --abort || true
                  exit 1
                fi
                GIT_EDITOR=true git rebase --continue
                if git push origin "HEAD:${branch}"; then
                  echo "pushed database on attempt ${attempt}"
                  exit 0
                fi
                echo "push rejected after rebase, retry ${attempt}"
              else
                echo "git pull --rebase failed, retry ${attempt}"
              fi
              if [ "$attempt" -eq 3 ]; then
                exit 1
              fi
              attempt=$((attempt + 1))
              sleep $((attempt * 2))
            done
            exit 1
          fi
