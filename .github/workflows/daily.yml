name: Daily ALPR signal run

on:
  schedule:
    # GitHub Actions cron is UTC and does not follow daylight saving time.
    # 10:00 UTC is 6:00 AM Eastern Daylight Time.
    # 11:00 UTC is 6:00 AM Eastern Standard Time.
    # A scheduled run collects only when the America/New_York hour is 6.
    # workflow_dispatch sets ALPR_SCHEDULED to 0, so a manual run always proceeds.
    - cron: "0 10 * * *"
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      live_tests:
        description: Run the live Haiku 10-passage classifier test
        type: boolean
        default: false
      lookback_days:
        description: Backfill window in days. Empty keeps the normal 14/90 rule.
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: alpr-daily
  cancel-in-progress: false

jobs:
  live-tests:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.live_tests == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Live Haiku 10-passage test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m pytest tests/test_classify_live.py -q

  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect, classify, and publish
        env:
          # workflow_dispatch leaves this unset-as-zero so the 6 AM Eastern gate does not apply.
          ALPR_SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '0' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE_ID: ${{ secrets.NOTION_PARENT_PAGE_ID }}
          NOTION_SIGNALS_DB_ID: ${{ secrets.NOTION_SIGNALS_DB_ID }}
          NOTION_AGENCIES_DB_ID: ${{ secrets.NOTION_AGENCIES_DB_ID }}
          LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
          OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          DIGEST_TO: ${{ secrets.DIGEST_TO }}
          ALPR_LOOKBACK_DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.lookback_days || '' }}
        run: python -m monitor.run --db data/monitor.sqlite

      - name: Commit the updated database
        run: |
          git config user.name "alpr-monitor"
          git config user.email "actions@github.com"
          git add data/monitor.sqlite
          if git diff --cached --quiet; then
            echo "No database change"
          else
            git commit -m "Daily signal database update"
            git push
          fi
