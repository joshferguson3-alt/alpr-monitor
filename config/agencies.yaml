# Version 1 agencies. Sworn counts were checked against public sources on 2026-11-12.
# Cobb County PD (639 sworn, FBI 2025) and Gwinnett County PD (929 authorized sworn, 2026 budget)
# are outside 41-550 and are not in this list. Replacements are Roswell PD and Johns Creek PD.
#
# Segments: inside 1-40, mid_city 41-100, t1200 101-550, major 551+.

- id: brookhaven-pd
  name: Brookhaven Police Department
  state: GA
  type: municipal_police
  # 100 sworn officers. City of Brookhaven State of the City 2026:
  # https://www.brookhavenga.gov/DocumentCenter/View/4293/State-of-the-City-2026-PDF
  # The older Who We Are page still says 93 authorized full-time sworn and cites a December 2020 snapshot:
  # https://www.brookhavenga.gov/195/Who-We-Are
  sworn_officers: 100
  segment: mid_city
  governing_body: Brookhaven City Council
  # PrimeGov portal. robots.txt is "User-agent: * / Disallow: /", so the collector skips it.
  meeting_platform: primegov
  meeting_url: https://brookhavenga.primegov.com/public/portal
  youtube_channel: null
  alpr_vendor: unknown
  alpr_camera_count: null
  flock_transparency_url: null
  contract_end_date: null
  legislative_districts: {state_house: [], state_senate: [], us_house: []}
  aliases: ["Brookhaven PD", "Brookhaven Police"]

- id: dunwoody-pd
