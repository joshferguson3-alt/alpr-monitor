- id: roswell-pd
  name: Roswell Police Department
  state: GA
  type: municipal_police
  # Replaces Cobb County Police Department (639 sworn, FBI 2025, outside 41-550):
  # https://policecensus.com/agencies/ga/cobb-county-police-department
  # 160 sworn officer positions, fully staffed.
  # https://www.roswellgov.com/government/departments-division/police-department/
  sworn_officers: 160
  segment: t1200
  governing_body: Roswell Mayor and Council
  # Current portal is IQM2, not the stale Legistar site (last events in that API are from 2014).
