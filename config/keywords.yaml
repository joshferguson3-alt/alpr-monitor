# Strong terms: one match is enough.
# Weak terms: a second keyword (strong or weak) must sit within 300 characters.
# "Flock" matches only when capitalized mid-sentence, or next to
# camera, safety, contract, or license. Lowercase "flock" alone does not match.
# "LPR" is matched as an uppercase acronym and still needs a second term.

strong:
  - license plate reader
  - license plate recognition
  - automated license plate
  - ALPR
  - plate reader
  - Flock Safety
  - Flock Group
  - Flock camera
  - vehicle location data
  - location surveillance
  - Axon Outpost
  - Axon Lightpost
  - Fusus
  - Vigilant
  - Rekor
  - real-time crime center
  - vehicle recognition camera

weak:
  - Flock
  - LPR
  - RTCC
  - surveillance camera
  - hot list
  - data retention
  - camera contract
  - Motorola Solutions
  - Axon

