- id: axon-news
  collector: rss
  entity: axon
  url: https://www.axon.com/newsroom/rss
  cadence: daily
  doc_type: press
  # axon.com returns HTTP 403 to this client. news.google.com/robots.txt
  # Disallow: / and does not allow /rss, so a Google News query is not a fallback.
  enabled: false
  skip_reason: "disabled, skipped (axon.com returns HTTP 403; no public RSS, and news.google.com/robots.txt disallows /rss)"
