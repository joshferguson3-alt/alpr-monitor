# One source per feed. Agency differences stay in this file.
# Collectors that need a missing API key log "missing key, skipped" and the run continues.

- id: brookhaven-meetings
  collector: primegov
  entity: brookhaven-pd
  url: https://brookhavenga.primegov.com/public/portal
  cadence: daily
  doc_type: agenda
  # PrimeGov robots.txt is Disallow: /. brookhavenga.gov/AgendaCenter is also
  # disallowed for User-agent: *. No CivicClerk or Legistar client. Left disabled.
  # Checked 2026-11-19.
  enabled: false
  skip_reason: "disabled, skipped (PrimeGov and brookhavenga.gov/AgendaCenter are disallowed by robots.txt)"

- id: brookhaven-news
  collector: generic_html
  entity: brookhaven-pd
  url: https://www.brookhavenga.gov/m/newsflash
  cadence: daily
  doc_type: press
  selectors:
    item: ".listing, .newsFlashItem, article .item"
    title: "a"
    link: "a"

- id: dunwoody-meetings
  collector: generic_html
  entity: dunwoody-pd
  url: https://dunwoodyga.hylandcloud.com/211agendaonline/Meetings
  mode: onbase
  cadence: daily
  doc_type: agenda
  # The meetings page is a search form. mode=onbase POSTs City Council and
  # work session for the last year and this year, then downloads agenda packets.
  # robots.txt is 404, so the host is allowed. Checked 2026-11-19.
  meeting_types: ["106", "107"]

- id: sandy-springs-meetings
  collector: civicplus
  entity: sandy-springs-pd
  url: https://sandyspringsga.portal.civicclerk.com/
  mode: civicclerk
  tenant: sandyspringsga
  cadence: daily
  doc_type: agenda
  categories:
    - City Council
    - Mayor and Council

- id: marietta-meetings
  collector: civicplus
  entity: marietta-pd
  url: https://www.mariettaga.gov/AgendaCenter
  mode: agenda_center
  cadence: daily
  doc_type: agenda

- id: roswell-meetings
  collector: iqm2
  entity: roswell-pd
  url: https://roswellcityga.iqm2.com/Citizens/Default.aspx
  cadence: daily
  doc_type: agenda
  # IQM2 allows the portal (crawl-delay 60) but the page times out from GitHub
  # Actions. roswellgov.com has no AgendaCenter, disallows /wp-content/uploads,
  # and CivicClerk/Legistar are 404. Left disabled. Checked 2026-11-19.
  enabled: false
  skip_reason: "disabled, skipped (roswellcityga.iqm2.com timed out from GitHub Actions; city site has no allowed agenda feed)"
  bodies:
    - Mayor and Council

